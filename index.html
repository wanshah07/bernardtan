<!doctype html>
<html lang="en" data-theme="day">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <title>Bernard Tan</title>
    <meta name="description" content="Bernard's own app: gallery, Drive, Sheets, reminders and games, on phone, tablet and desktop." />
    <meta name="theme-color" content="#E8452C" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Bernard" />
    <link rel="icon" href="./koko.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./icon-192.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- The Google Fonts stylesheet is fetched off the critical path: preload it, apply it only once it
         has arrived (media="print" until onload flips it to "all"), and fall back to a plain blocking
         link when scripts are off. First paint no longer waits on fonts.googleapis.com; display=swap
         shows the system fallback until Fredoka and Nunito land. -->
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800&display=swap" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800&display=swap" media="print" onload="this.media='all'" />
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800&display=swap" /></noscript>
    <script>
      // the saved theme before first paint, so there is no flash
      try {
        var t = localStorage.getItem("bernard.theme"), bar = { day: "#E8452C", night: "#201816", glow: "#0E1626" };
        if (bar[t]) { document.documentElement.setAttribute("data-theme", t); document.querySelector('meta[name="theme-color"]').setAttribute("content", bar[t]); }
      } catch (e) {}
    </script>
  </head>
  <body class="bg-bg text-ink font-body antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
